packages:
  - 'apps/*'
  - 'packages/*'

# Isolated node_modules, no hoisting: each package only sees the dependencies it declares.
nodeLinker: isolated
shamefullyHoist: false
autoInstallPeers: true
strictPeerDependencies: false
linkWorkspacePackages: true
preferWorkspacePackages: true
dedupePeerDependents: true
enablePrePostScripts: false

# Versions shared by several workspaces. Reference them as "catalog:".
catalog:
  typescript: 5.9.3
  eslint: ^9.39.1
  prettier: ^3.6.2
  vitest: ^4.1.10
  '@vitest/coverage-istanbul': ^4.1.10

# pnpm only runs dependency build scripts that are explicitly allowed.
allowBuilds:
  '@heroui/shared-utils': true
  '@parcel/watcher': false
  '@swc/core': false
  esbuild: true
  sharp: true
  supabase: false
  unrs-resolver: true
minimumReleaseAgeExclude:
  - lucide-react@1.76.0

# Security overrides for transitive dependencies with no upstream fix.
overrides:
  # GHSA-g3hv-75wg-m249 (CVE-2026-118764): minimatch >=7 <11.0.1 is vulnerable and
  # @trivago/prettier-plugin-sort-imports@6.0.2 (latest) still pins ^9. The plugin only
  # calls `minimatch(path, pattern, { matchBase })`, which v11 keeps. Drop this once the
  # plugin moves to minimatch >=11.0.1.
  '@trivago/prettier-plugin-sort-imports>minimatch': ^11.0.1
