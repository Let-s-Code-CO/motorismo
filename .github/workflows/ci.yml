name: ci

# Runs on every PR and on pushes to develop. Keep job names stable: branch protection rules
# reference them as required checks.
#   quality      lint, types, unit tests and a build — no services needed.
#   integration  real local Supabase (Docker): pgTAP, generated types, sandbox suites and E2E.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # The build only needs well-formed values; nothing is queried at build time.
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-placeholder-key
      SUPABASE_SECRET_KEY: ci-placeholder-secret
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Type check
        run: pnpm ts:check
      - name: Unit tests
        run: pnpm test
      - name: Build
        run: pnpm build

  integration:
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      # The Supabase CLI comes from the lockfile (exact version), never from a setup action.
      - run: pnpm install --frozen-lockfile
      - name: Start Supabase (replays every migration + seeds)
        run: pnpm db:start
      - name: Export the sandbox settings for the build and the tests
        working-directory: packages/supabase
        run: |
          status="$(./node_modules/.bin/supabase status -o json 2>/dev/null)"
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$(jq -r .API_URL <<<"$status")"
            echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$(jq -r .PUBLISHABLE_KEY <<<"$status")"
            echo "SUPABASE_SECRET_KEY=$(jq -r .SECRET_KEY <<<"$status")"
            echo "NEXT_PUBLIC_SITE_URL=http://localhost:3000"
          } >> "$GITHUB_ENV"
      - name: pgTAP
        run: pnpm db:test
      - name: Generated types are current
        run: pnpm --filter @motorismo/supabase types:check
      - name: Sandbox suites (Auth, RLS and emails through the real API)
        run: pnpm --filter web test:sandbox
      - name: Build
        run: pnpm --filter web build
      - name: Install Playwright browser
        run: pnpm --filter web exec playwright install --with-deps chromium
      - name: E2E tests
        run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7
      - name: Stop Supabase
        if: always()
        run: pnpm db:stop
